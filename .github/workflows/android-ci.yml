name: Android CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13 and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Run unit tests and build debug and release APKs
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Verify diagnostics are absent from Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/release-manifest.txt
          if grep -E 'androidx.core.content.FileProvider|diagnostics.files' /tmp/release-manifest.txt; then
            echo "Unexpected diagnostics FileProvider found in Release manifest"
            exit 1
          fi
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings | grep -q 'net/lingala/zip4j'; then
              echo "Unexpected Zip4j classes found in Release APK"
              exit 1
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes[0-9]*[.]dex$' || true)
          if unzip -p "$APK" classes.dex | strings | grep -Fq 'Diagnósticos (Debug)'; then
            echo "Unexpected diagnostics UI string found in Release APK"
            exit 1
          fi
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -Ei 'PACKAGE_USAGE_STATS|SYSTEM_ALERT_WINDOW|BIND_ACCESSIBILITY_SERVICE|android.permission.INTERNET'; then
            echo "Unexpected sensitive permission found in Release APK"
            exit 1
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: DigiAutoStart-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
