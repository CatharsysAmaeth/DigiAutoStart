name: Android CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and publish APK files
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13 and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Run unit tests and build debug and release APKs
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Verify diagnostics are absent from Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/release-manifest.txt
          if grep -E 'androidx.core.content.FileProvider|diagnostics.files' /tmp/release-manifest.txt; then
            echo "Unexpected diagnostics FileProvider found in Release manifest"
            exit 1
          fi
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings | grep -q 'net/lingala/zip4j'; then
              echo "Unexpected Zip4j classes found in Release APK"
              exit 1
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes[0-9]*[.]dex$' || true)
          if unzip -p "$APK" classes.dex | strings | grep -Fq 'Diagnósticos (Debug)'; then
            echo "Unexpected diagnostics UI string found in Release APK"
            exit 1
          fi
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -Ei 'PACKAGE_USAGE_STATS|SYSTEM_ALERT_WINDOW|BIND_ACCESSIBILITY_SERVICE|android.permission.INTERNET'; then
            echo "Unexpected sensitive permission found in Release APK"
            exit 1
          fi

      # PRs and feature branches only build/test. Publishing runs only from main.
      - name: Publish normal APK in public repository
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk
          install -m 0644 app/build/outputs/apk/release/app-release.apk apk/DigiAutoStart-normal.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/DigiAutoStart-normal.apk
          if ! git diff --cached --quiet; then
            git commit -m "build: publish normal APK"
            git push
          else
            echo "Normal APK is unchanged; no commit needed."
          fi

      - name: Publish Debug APK in private diagnostics repository
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.DIAGNOSTICS_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::DIAGNOSTICS_REPO_TOKEN is not configured; skipping private Debug APK publication."
            exit 0
          fi
          FILE="apk/DigiAutoStart-debug.apk"
          base64 -w 0 app/build/outputs/apk/debug/app-debug.apk > /tmp/debug-apk.base64
          EXISTING_SHA="$(gh api "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/$FILE?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            jq --rawfile content /tmp/debug-apk.base64 -n --arg message "build: publish Debug APK" --arg sha "$EXISTING_SHA" --arg branch "main" '{message:$message,content:$content,sha:$sha,branch:$branch}' |
              gh api --method PUT "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/$FILE" --input -
          else
            jq --rawfile content /tmp/debug-apk.base64 -n --arg message "build: publish Debug APK" --arg branch "main" '{message:$message,content:$content,branch:$branch}' |
              gh api --method PUT "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/$FILE" --input -
          fi
