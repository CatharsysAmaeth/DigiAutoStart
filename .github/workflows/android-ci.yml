name: Android CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and publish APK files
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13 and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Prepare stable application signing key
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.DIAGNOSTICS_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digiautostart-signing"
          KEYSTORE="$RUNNER_TEMP/digiautostart-signing/debug.keystore"
          KEY_B64=/tmp/digiautostart-debug-keystore.b64

          # Generate a valid JKS key on the first run; reuse the private copy thereafter.
          if gh api "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/signing/debug.keystore.b64?ref=main" --jq '.content' 2>/dev/null |
             tr -d '\n' | base64 -d > "$KEYSTORE" &&
             keytool -list -keystore "$KEYSTORE" -storetype JKS -storepass android -alias digiautostart >/dev/null 2>&1; then
            echo "Reusing stable private Debug signing key."
          else
            rm -f "$KEYSTORE"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype JKS \
              -storepass android -keypass android -alias digiautostart \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DigiAutoStart Debug, OU=Development, O=CatharsysAmaeth, C=PT"
            base64 -w 0 "$KEYSTORE" > "$KEY_B64"
            EXISTING_SHA="$(gh api "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/signing/debug.keystore.b64?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$EXISTING_SHA" ]; then
              jq --rawfile content "$KEY_B64" -n --arg message "build: replace invalid Debug signing key" --arg sha "$EXISTING_SHA" --arg branch "main" '{message:$message,content:$content,sha:$sha,branch:$branch}' |
                gh api --method PUT "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/signing/debug.keystore.b64" --input -
            else
              jq --rawfile content "$KEY_B64" -n --arg message "build: add stable Debug signing key" --arg branch "main" '{message:$message,content:$content,branch:$branch}' |
                gh api --method PUT "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/signing/debug.keystore.b64" --input -
            fi
          fi

          echo "DIGIAUTOSTART_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "DIGIAUTOSTART_SIGNING_STORE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Run unit tests and build debug and release APKs
        env:
          DIAGNOSTICS_REPO_TOKEN: ${{ secrets.DIAGNOSTICS_REPO_TOKEN }}
          DIAGNOSTICS_ZIP_PASSWORD: ${{ secrets.DIAGNOSTICS_ZIP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export DIAGNOSTICS_REPO_TOKEN_B64="$(printf '%s' "$DIAGNOSTICS_REPO_TOKEN" | base64 -w 0)"
          export DIAGNOSTICS_ZIP_PASSWORD_B64="$(printf '%s' "$DIAGNOSTICS_ZIP_PASSWORD" | base64 -w 0)"
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Upload signed Debug prototype APK for device testing
        if: success() && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/feature/')
        uses: actions/upload-artifact@v4
        with:
          name: DigiAutoStart-debug-standby-prototype
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify Release automation is present and Debug features are absent
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/release-manifest.txt

          # The production app must contain the automation components and required permissions.
          grep -Fq 'AutomationService' /tmp/release-manifest.txt
          grep -Fq 'AutomationBootReceiver' /tmp/release-manifest.txt
          for permission in SYSTEM_ALERT_WINDOW PACKAGE_USAGE_STATS FOREGROUND_SERVICE FOREGROUND_SERVICE_SPECIAL_USE RECEIVE_BOOT_COMPLETED; do
            grep -Fq "android.permission.$permission" /tmp/release-manifest.txt
          done

          # Private diagnostics, file sharing, updater and Debug-only network/install access must be absent.
          if grep -E 'androidx.core.content.FileProvider|diagnostics.files' /tmp/release-manifest.txt; then
            echo "Unexpected diagnostics FileProvider found in Release manifest"
            exit 1
          fi
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" |
             grep -Ei 'android.permission.INTERNET|android.permission.REQUEST_INSTALL_PACKAGES|BIND_ACCESSIBILITY_SERVICE'; then
            echo "Unexpected Debug-only network, package-install or accessibility permission found in Release"
            exit 1
          fi

          while IFS= read -r dex; do
            DEX_STRINGS="$(unzip -p "$APK" "$dex" | strings)"
            if printf '%s' "$DEX_STRINGS" | grep -Eq 'net/lingala/zip4j|DIAGNOSTICS_GITHUB_TOKEN|DIAGNOSTICS_ZIP_PASSWORD|DigiAutoStart-Diagnostics|Diagnósticos \(Debug\)|Verificar atualizações'; then
              echo "Unexpected private diagnostics or Debug updater code found in Release APK"
              exit 1
            fi
            if ! printf '%s' "$DEX_STRINGS" | grep -q 'automation_screen_off_decision'; then
              echo "Standby automation implementation is missing from Release APK"
              exit 1
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes[0-9]*[.]dex$')

      - name: Publish normal APK in public repository
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk
          install -m 0644 app/build/outputs/apk/release/app-release.apk apk/DigiAutoStart-normal.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/DigiAutoStart-normal.apk
          if ! git diff --cached --quiet; then
            git commit -m "build: publish normal APK"
            git push
          else
            echo "Normal APK is unchanged; no commit needed."
          fi

      - name: Publish Debug APK and version metadata in private repository
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
        env:
          GH_TOKEN: ${{ secrets.DIAGNOSTICS_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DIAGNOSTICS_REPO_TOKEN is required to publish the private Debug APK."
            exit 1
          fi

          FILE="apk/DigiAutoStart-debug.apk"
          base64 -w 0 app/build/outputs/apk/debug/app-debug.apk > /tmp/debug-apk.base64
          EXISTING_SHA="$(gh api "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/$FILE?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            jq --rawfile content /tmp/debug-apk.base64 -n --arg message "build: publish Debug APK" --arg sha "$EXISTING_SHA" --arg branch "main" '{message:$message,content:$content,sha:$sha,branch:$branch}' |
              gh api --method PUT "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/$FILE" --input -
          else
            jq --rawfile content /tmp/debug-apk.base64 -n --arg message "build: publish Debug APK" --arg branch "main" '{message:$message,content:$content,branch:$branch}' |
              gh api --method PUT "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/$FILE" --input -
          fi

          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"$/\1/p' app/build.gradle.kts | head -n1)"
          APK_SHA256="$(sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')"
          jq -n --arg versionName "$VERSION_NAME" --arg versionCode "$VERSION_CODE" --arg sha256 "$APK_SHA256" \
            '{versionCode:($versionCode|tonumber),versionName:$versionName,sha256:$sha256,apk:"apk/DigiAutoStart-debug.apk"}' > /tmp/debug-version.json
          base64 -w 0 /tmp/debug-version.json > /tmp/debug-version.base64
          VERSION_SHA="$(gh api "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/apk/version.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$VERSION_SHA" ]; then
            jq --rawfile content /tmp/debug-version.base64 -n --arg message "build: update Debug version metadata" --arg sha "$VERSION_SHA" --arg branch "main" '{message:$message,content:$content,sha:$sha,branch:$branch}' |
              gh api --method PUT "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/apk/version.json" --input -
          else
            jq --rawfile content /tmp/debug-version.base64 -n --arg message "build: add Debug version metadata" --arg branch "main" '{message:$message,content:$content,branch:$branch}' |
              gh api --method PUT "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/apk/version.json" --input -
          fi

      - name: Upload normal Release APK as a workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DAdA-release-no-debug-menu
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish normal Release APK and metadata in private repository
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
        env:
          GH_TOKEN: ${{ secrets.DIAGNOSTICS_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DIAGNOSTICS_REPO_TOKEN is required to publish the normal Release APK."
            exit 1
          fi

          FILE="apk/DigiAutoStart-release.apk"
          base64 -w 0 app/build/outputs/apk/release/app-release.apk > /tmp/release-apk.base64
          EXISTING_SHA="$(gh api "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/$FILE?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            jq --rawfile content /tmp/release-apk.base64 -n --arg message "build: publish normal Release APK" --arg sha "$EXISTING_SHA" --arg branch "main" '{message:$message,content:$content,sha:$sha,branch:$branch}' |
              gh api --method PUT "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/$FILE" --input -
          else
            jq --rawfile content /tmp/release-apk.base64 -n --arg message "build: publish normal Release APK" --arg branch "main" '{message:$message,content:$content,branch:$branch}' |
              gh api --method PUT "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/$FILE" --input -
          fi

          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"$/\1/p' app/build.gradle.kts | head -n1)"
          APK_SHA256="$(sha256sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}')"
          jq -n --arg versionName "$VERSION_NAME" --arg versionCode "$VERSION_CODE" --arg sha256 "$APK_SHA256" \
            '{versionCode:($versionCode|tonumber),versionName:$versionName,sha256:$sha256,apk:"apk/DigiAutoStart-release.apk",buildType:"release",debugMenu:false,automation:true,diagnostics:false,privateUpdater:false}' > /tmp/release-version.json
          base64 -w 0 /tmp/release-version.json > /tmp/release-version.base64
          VERSION_SHA="$(gh api "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/apk/release-version.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$VERSION_SHA" ]; then
            jq --rawfile content /tmp/release-version.base64 -n --arg message "build: update normal Release version metadata" --arg sha "$VERSION_SHA" --arg branch "main" '{message:$message,content:$content,sha:$sha,branch:$branch}' |
              gh api --method PUT "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/apk/release-version.json" --input -
          else
            jq --rawfile content /tmp/release-version.base64 -n --arg message "build: add normal Release version metadata" --arg branch "main" '{message:$message,content:$content,branch:$branch}' |
              gh api --method PUT "repos/CatharsysAmaeth/DigiAutoStart-Diagnostics/contents/apk/release-version.json" --input -
          fi
