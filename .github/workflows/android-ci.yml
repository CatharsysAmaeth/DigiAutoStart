name: Android CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and publish APK files
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13 and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Prepare stable application signing key
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.DADA_PRIVATE_TOKEN }}
          PRIVATE_ASSETS_REPOSITORY: ${{ secrets.DADA_PRIVATE_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$PRIVATE_ASSETS_REPOSITORY"
          if [ -z "$GH_TOKEN" ] || [ -z "$PRIVATE_ASSETS_REPOSITORY" ]; then
            echo "::error::Required internal build credentials are not configured."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digiautostart-signing"
          KEYSTORE="$RUNNER_TEMP/digiautostart-signing/debug.keystore"
          KEY_B64=/tmp/digiautostart-debug-keystore.b64

          if gh api "repos/$PRIVATE_ASSETS_REPOSITORY/contents/signing/debug.keystore.b64?ref=main" --jq '.content' 2>/dev/null |
             tr -d '\n' | base64 -d > "$KEYSTORE" &&
             keytool -list -keystore "$KEYSTORE" -storetype JKS -storepass android -alias digiautostart >/dev/null 2>&1; then
            echo "Reusing stable application signing key."
          else
            rm -f "$KEYSTORE"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype JKS \
              -storepass android -keypass android -alias digiautostart \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DAdA Signing, OU=Android, O=DAdA, C=PT"
            base64 -w 0 "$KEYSTORE" > "$KEY_B64"
            EXISTING_SHA="$(gh api "repos/$PRIVATE_ASSETS_REPOSITORY/contents/signing/debug.keystore.b64?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$EXISTING_SHA" ]; then
              jq --rawfile content "$KEY_B64" -n --arg message "build: replace invalid Debug signing key" --arg sha "$EXISTING_SHA" --arg branch "main" '{message:$message,content:$content,sha:$sha,branch:$branch}' |
                gh api --method PUT "repos/$PRIVATE_ASSETS_REPOSITORY/contents/signing/debug.keystore.b64" --input -
            else
              jq --rawfile content "$KEY_B64" -n --arg message "build: add stable Debug signing key" --arg branch "main" '{message:$message,content:$content,branch:$branch}' |
                gh api --method PUT "repos/$PRIVATE_ASSETS_REPOSITORY/contents/signing/debug.keystore.b64" --input -
            fi
          fi

          echo "DIGIAUTOSTART_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "DIGIAUTOSTART_SIGNING_STORE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Run unit tests and build all required variants
        env:
          DADA_PRIVATE_REPOSITORY: ${{ secrets.DADA_PRIVATE_REPOSITORY }}
          DADA_PRIVATE_TOKEN: ${{ secrets.DADA_PRIVATE_TOKEN }}
          DADA_DEBUG_REPORT_PASSWORD: ${{ secrets.DADA_DEBUG_REPORT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export DADA_PRIVATE_REPOSITORY_B64="$(printf '%s' "$DADA_PRIVATE_REPOSITORY" | base64 -w 0)"
          export DADA_PRIVATE_TOKEN_B64="$(printf '%s' "$DADA_PRIVATE_TOKEN" | base64 -w 0)"
          export DADA_DEBUG_REPORT_PASSWORD_B64="$(printf '%s' "$DADA_DEBUG_REPORT_PASSWORD" | base64 -w 0)"
          gradle --no-daemon --stacktrace testAndroid12DebugUnitTest assembleAndroid12Debug assembleAndroid12Release assembleAndroid9Release

      - name: Verify both Release APKs and variant isolation
        shell: bash
        run: |
          set -euo pipefail
          for variant in android12 android9; do
            APK="app/build/outputs/apk/$variant/release/app-$variant-release.apk"
            test -f "$APK"
            MANIFEST="/tmp/$variant-release-manifest.txt"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > "$MANIFEST"

            grep -Fq 'AutomationService' "$MANIFEST"
            grep -Fq 'AutomationBootReceiver' "$MANIFEST"
            for permission in SYSTEM_ALERT_WINDOW PACKAGE_USAGE_STATS FOREGROUND_SERVICE RECEIVE_BOOT_COMPLETED; do
              grep -Fq "android.permission.$permission" "$MANIFEST"
            done

            if [ "$variant" = android12 ]; then
              grep -Fq 'FOREGROUND_SERVICE_SPECIAL_USE' "$MANIFEST"
              grep -Fq 'specialUse' "$MANIFEST"
            else
              if grep -Eq 'FOREGROUND_SERVICE_SPECIAL_USE|specialUse|PROPERTY_SPECIAL_USE_FGS_SUBTYPE' "$MANIFEST"; then
                echo "Android 9 manifest contains Android 14-only foreground-service declarations"
                exit 1
              fi
              "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -Fq "sdkVersion:'28'"
              "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='pt.catharsys.digiautostart.android9'"
            fi

            if grep -E 'androidx.core.content.FileProvider|diagnostics.files' "$MANIFEST"; then
              echo "Unexpected diagnostics FileProvider found in $variant Release manifest"
              exit 1
            fi
            if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" |
               grep -Ei 'android.permission.INTERNET|android.permission.REQUEST_INSTALL_PACKAGES|BIND_ACCESSIBILITY_SERVICE'; then
              echo "Unexpected Debug-only network, package-install or accessibility permission found in $variant Release"
              exit 1
            fi

            DEX_STRINGS="$(while IFS= read -r dex; do
              unzip -p "$APK" "$dex" | strings
            done < <(unzip -Z1 "$APK" | grep -E '^classes[0-9]*[.]dex$'))"

            if printf '%s' "$DEX_STRINGS" | grep -Eq 'net/lingala/zip4j|DADA_PRIVATE_(TOKEN|REPOSITORY)_B64|DADA_DEBUG_REPORT_PASSWORD_B64|Diagnósticos \\(Debug\\)|Verificar atualizações'; then
              echo "Unexpected internal diagnostic or Debug updater code found in $variant Release APK"
              exit 1
            fi
            for marker in wake_should_launch launch_digi_on_boot; do
              if ! printf '%s' "$DEX_STRINGS" | grep -F "$marker" >/dev/null; then
                echo "Standby/startup automation marker is missing from $variant Release APK: $marker"
                exit 1
              fi
            done
          done

      - name: Publish stable APKs as public GitHub Release assets
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"$/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not determine the application version."
            exit 1
          fi
          TAG="v$VERSION_NAME"
          APK_ANDROID12="app/build/outputs/apk/android12/release/app-android12-release.apk"
          APK_ANDROID9="app/build/outputs/apk/android9/release/app-android9-release.apk"
          test -f "$APK_ANDROID12"
          test -f "$APK_ANDROID9"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$APK_ANDROID12#DAdA-$VERSION_NAME-Android12.apk" \
              "$APK_ANDROID9#DAdA-$VERSION_NAME-Android9.apk" --clobber
          else
            gh release create "$TAG" \
              "$APK_ANDROID12#DAdA-$VERSION_NAME-Android12.apk" \
              "$APK_ANDROID9#DAdA-$VERSION_NAME-Android9.apk" \
              --title "DAdA $VERSION_NAME" \
              --generate-notes
          fi

      - name: Publish Android 12 Debug APK and version metadata to internal storage
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
        env:
          GH_TOKEN: ${{ secrets.DADA_PRIVATE_TOKEN }}
          PRIVATE_ASSETS_REPOSITORY: ${{ secrets.DADA_PRIVATE_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$PRIVATE_ASSETS_REPOSITORY"
          if [ -z "${GH_TOKEN:-}" ] || [ -z "$PRIVATE_ASSETS_REPOSITORY" ]; then
            echo "::error::Internal artifact publishing is not configured."
            exit 1
          fi

          APK_DEBUG="app/build/outputs/apk/android12/debug/app-android12-debug.apk"
          FILE="apk/DigiAutoStart-debug.apk"
          base64 -w 0 "$APK_DEBUG" > /tmp/debug-apk.base64
          EXISTING_SHA="$(gh api "repos/$PRIVATE_ASSETS_REPOSITORY/contents/$FILE?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            jq --rawfile content /tmp/debug-apk.base64 -n --arg message "build: publish Debug APK" --arg sha "$EXISTING_SHA" --arg branch "main" '{message:$message,content:$content,sha:$sha,branch:$branch}' |
              gh api --method PUT "repos/$PRIVATE_ASSETS_REPOSITORY/contents/$FILE" --input -
          else
            jq --rawfile content /tmp/debug-apk.base64 -n --arg message "build: publish Debug APK" --arg branch "main" '{message:$message,content:$content,branch:$branch}' |
              gh api --method PUT "repos/$PRIVATE_ASSETS_REPOSITORY/contents/$FILE" --input -
          fi

          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"$/\1/p' app/build.gradle.kts | head -n1)"
          APK_SHA256="$(sha256sum "$APK_DEBUG" | awk '{print $1}')"
          jq -n --arg versionName "$VERSION_NAME" --arg versionCode "$VERSION_CODE" --arg sha256 "$APK_SHA256" \
            '{versionCode:($versionCode|tonumber),versionName:$versionName,sha256:$sha256,apk:"apk/DigiAutoStart-debug.apk"}' > /tmp/debug-version.json
          base64 -w 0 /tmp/debug-version.json > /tmp/debug-version.base64
          VERSION_SHA="$(gh api "repos/$PRIVATE_ASSETS_REPOSITORY/contents/apk/version.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$VERSION_SHA" ]; then
            jq --rawfile content /tmp/debug-version.base64 -n --arg message "build: update Debug version metadata" --arg sha "$VERSION_SHA" --arg branch "main" '{message:$message,content:$content,sha:$sha,branch:$branch}' |
              gh api --method PUT "repos/$PRIVATE_ASSETS_REPOSITORY/contents/apk/version.json" --input -
          else
            jq --rawfile content /tmp/debug-version.base64 -n --arg message "build: add Debug version metadata" --arg branch "main" '{message:$message,content:$content,branch:$branch}' |
              gh api --method PUT "repos/$PRIVATE_ASSETS_REPOSITORY/contents/apk/version.json" --input -
          fi

      - name: Upload Release APKs as workflow artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DAdA-release-apks
          path: |
            app/build/outputs/apk/android12/release/app-android12-release.apk
            app/build/outputs/apk/android9/release/app-android9-release.apk
          if-no-files-found: error
          retention-days: 14
