name: Publish Android APKs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build standard Release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Build Debug APK with diagnostics
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk "DigiAutoStart-${GITHUB_REF_NAME}-normal.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "DigiAutoStart-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DigiAutoStart ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            DigiAutoStart-${{ github.ref_name }}-normal.apk
            DigiAutoStart-${{ github.ref_name }}-debug.apk
