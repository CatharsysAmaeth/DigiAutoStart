name: Parse private DAdA diagnostic report
run-name: Parse private DAdA report 2026-11-28 01:09
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/parse-diagnostic-reports.yml"
      - "tools/parse_private_diagnostic_report.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parse-private-dada-diagnostics
  cancel-in-progress: false

jobs:
  parse-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public workflow code
        uses: actions/checkout@v7

      - name: Fetch, validate, redact and save report privately
        env:
          GH_TOKEN: ${{ secrets.DADA_PRIVATE_TOKEN }}
          DADA_PRIVATE_TOKEN: ${{ secrets.DADA_PRIVATE_TOKEN }}
          DADA_PRIVATE_REPOSITORY: ${{ secrets.DADA_PRIVATE_REPOSITORY }}
          DADA_REPORT_NAMES: DigiAutoStart-20261128-010901.zip
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DADA_PRIVATE_TOKEN:-}" ] || [ -z "${DADA_PRIVATE_REPOSITORY:-}" ]; then
            echo "::error::Private diagnostics credentials are not configured."
            exit 1
          fi
          python3 tools/parse_private_diagnostic_report.py

# This run is pinned to the single report received at 2026-11-28 01:09:14 UTC.
